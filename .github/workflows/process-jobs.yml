name: Process Job Queue

on:
  # Ejecutar cada 5 minutos
  schedule:
    - cron: '*/5 * * * *'

  # Permitir ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  process-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Reintentar automáticamente si falla por problemas de infraestructura
    strategy:
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Validate Environment
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "Error: NEXT_PUBLIC_SITE_URL variable is not set in GitHub Repository Settings."
            echo "Please go to Settings -> Secrets and variables -> Actions -> Variables and add it."
            exit 1
          fi

      - name: Call cron endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET \
            "${{ vars.NEXT_PUBLIC_SITE_URL }}/api/cron/process-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "Error: Job processing failed with status $http_code"
            exit 1
          fi

          echo "Jobs processed successfully"
